<ion-app>
    <ion-menu side="start" menuId="first" contentId="main">
      <ion-content>
        <ion-list>
          <ion-item lines="none" color="primary">
            <ion-avatar item-start>
              <img [src]="dataProvider.ProfileImage" menuClose (click)="openProfile()" />
            </ion-avatar>
            <ion-title class="threeDots">{{getTitle()}}</ion-title>
          </ion-item>
          <ion-menu-toggle auto-hide="false" *ngFor="let p of pages">
            <ion-item [routerLink]="p.url" routerDirection="root" [class.active-item]="selectedPath === p.url">
              <ion-icon slot="start" [name]="p.icon"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <!-- Sprachumschaltung: Sprachnamen bewusst NICHT uebersetzt (jede
               Sprache in ihrer eigenen Schreibweise), nur das Label. -->
          <ion-item lines="none">
            <ion-icon slot="start" name="language"></ion-icon>
            <ion-select
              [value]="currentLang"
              (ionChange)="switchLanguage($event.detail.value)"
              interface="popover"
              [label]="'MNU_LANGUAGE' | translate"
              labelPlacement="start">
              <ion-select-option value="de">Deutsch</ion-select-option>
              <ion-select-option value="en">English</ion-select-option>
            </ion-select>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main"></ion-router-outlet>
</ion-app>
